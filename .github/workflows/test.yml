name: Test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default token: every job here only reads the repo.
permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    # The whole suite finishes in seconds; a low cap turns a hung step into a
    # fast failure instead of burning the 6h default job timeout.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Read-only job — don't persist the GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned to match release.yml. `canary` floats build-to-build; an
          # unpinned regression in Bun's process-cleanup path once hung the
          # test step until the 6h job cap — keep CI on a known-good build.
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      # Catches workspace-topology drift (new/renamed/removed packages under
      # npm/* or packages/*) and version-metadata drift across releases.
      # `--frozen-lockfile` only enforces the dependency graph; a fresh install
      # rewrites the workspaces section, and any diff means bun.lock wasn't
      # committed alongside the change that produced it.
      - name: Verify lockfile is up to date
        run: |
          bun install
          git diff --exit-code bun.lock

      - name: Oxlint
        run: bun run lint

      - name: Prettier
        run: bun run format:check

  test:
    name: Type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Read-only job — don't persist the GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned to match release.yml. `canary` floats build-to-build; an
          # unpinned regression in Bun's process-cleanup path once hung the
          # test step until the 6h job cap — keep CI on a known-good build.
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: bun test --isolate

  smoke-windows:
    name: Windows binary smoke test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Read-only job — don't persist the GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13 # pinned to match release.yml — see the test job

      - run: bun install --frozen-lockfile

      # Native compile on Windows — proves the same artifact published via npm
      # actually starts on a Windows host. Cross-compile from Linux is what
      # release.yml ships; this catches Bun-on-Windows runtime regressions.
      - name: Compile for Windows
        run: bun build --compile src/index.ts --outfile dist/releases.exe

      - name: Run --version
        shell: bash
        run: ./dist/releases.exe --version
